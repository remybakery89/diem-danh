<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Đăng ký chương trình</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:20px 16px 40px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}h1,h2,p{margin-top:0}.muted{color:#6b7280}input,select,button{min-height:46px;border-radius:11px;font:inherit}input,select{width:100%;border:1px solid #d1d5db;padding:0 12px}button{border:0;background:#111827;color:#fff;font-weight:700;padding:0 16px;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#f9fafb;text-align:center}.num{font-size:25px;font-weight:800}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;white-space:nowrap}th{font-size:13px;color:#6b7280}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.ok{background:#dcfce7;color:#166534}.cancel{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.error{padding:11px;border-radius:11px;background:#fee2e2;color:#991b1b;margin-top:10px}.success{padding:11px;border-radius:11px;background:#dcfce7;color:#166534;margin-top:10px}@media(max-width:650px){.row,.stats{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div class="card" id="loginCard"><h1>Quản lý đăng ký</h1><p class="muted">Khu vực Admin — xem danh sách ca viên đã đăng ký theo chương trình.</p><label>Mật khẩu Admin</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" style="margin-top:10px;width:100%">Đăng nhập</button><div id="msg" class="hidden"></div></div>
<div id="app" class="hidden">
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>Đăng ký chương trình</h1><p id="programTitle" class="muted">Chọn chương trình để xem danh sách.</p></div><button onclick="logout()">Đăng xuất</button></div></div>
<div class="card"><div class="row"><div><label>Chương trình</label><select id="program"></select></div><div><label>Tìm kiếm</label><input id="search" placeholder="Tên, mã ca viên, bè..."></div></div><div class="actions"><button onclick="loadRows()">Làm mới</button></div></div>
<div class="card"><div class="stats"><div class="stat"><div class="num" id="registered">0</div><div>Đã đăng ký</div></div><div class="stat"><div class="num" id="cancelled">0</div><div>Đã hủy</div></div><div class="stat"><div class="num" id="total">0</div><div>Tổng bản ghi</div></div></div></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>Mã ca viên</th><th>Họ tên</th><th>Bè</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbw3vjfqpTIB5U8Kqij9Fa1FtR7RFA-QAreYjl0wBrVkWjGQL6QOyCdP-NtPgwi78lmdHA/exec';
let password=sessionStorage.getItem('adminRegistrationPassword')||'';let rows=[];let programs=[];
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');const q=new URLSearchParams({...params,callback:cb});const timer=setTimeout(()=>{cleanup();reject(new Error('Kết nối máy chủ quá lâu.'))},15000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=d=>{cleanup();resolve(d)};script.onerror=()=>{cleanup();reject(new Error('Không kết nối được máy chủ.'))};script.src=API+'?'+q;document.body.appendChild(script)})}
function setMsg(text,ok=false){const e=document.getElementById('msg');e.textContent=text;e.className=ok?'success':'error';e.classList.remove('hidden')}
async function login(){const p=document.getElementById('password').value;if(!p)return setMsg('Vui lòng nhập mật khẩu.');document.getElementById('loginBtn').disabled=true;try{const r=await jsonp({api:'registration_admin',password:p});if(!r.success)return setMsg(r.message||'Mật khẩu không đúng.');password=p;sessionStorage.setItem('adminRegistrationPassword',p);document.getElementById('loginCard').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadPrograms();}catch(e){setMsg(e.message)}finally{document.getElementById('loginBtn').disabled=false}}
async function loadPrograms(){const r=await jsonp({api:'registration_programs'});if(!r.success)throw new Error(r.message||'Không tải được chương trình.');programs=r.programs||[];const s=document.getElementById('program');s.innerHTML='<option value="">Tất cả chương trình</option>'+programs.map(p=>`<option value="${esc(p.maBuoi)}">${esc(p.tenBuoi)} — ${esc(p.maBuoi)}</option>`).join('');await loadRows()}
async function loadRows(){const maBuoi=document.getElementById('program').value;const r=await jsonp({api:'registration_admin',password,maBuoi});if(!r.success){if(r.message?.includes('Mật khẩu'))logout();else alert(r.message||'Không tải được dữ liệu.');return}rows=r.rows||[];document.getElementById('registered').textContent=maBuoi?(r.stats?.[maBuoi]?.daDangKy||0):rows.filter(x=>x.trangThai==='ĐÃ ĐĂNG KÝ').length;document.getElementById('cancelled').textContent=maBuoi?(r.stats?.[maBuoi]?.daHuy||0):rows.filter(x=>x.trangThai==='ĐÃ HỦY').length;document.getElementById('total').textContent=rows.length;const p=programs.find(x=>x.maBuoi===maBuoi);document.getElementById('programTitle').textContent=p?`${p.tenBuoi} — ${p.ngay}${p.gio?' · '+p.gio:''}`:'Tất cả chương trình';render()}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=rows.filter(x=>!q||[x.ma,x.hoTen,x.be,x.trangThai,x.maBuoi].join(' ').toLowerCase().includes(q));document.getElementById('rows').innerHTML=list.length?list.map(x=>`<tr><td>${esc(x.ma)}</td><td>${esc(x.hoTen)}</td><td>${esc(x.be)}</td><td>${esc(x.thoiGian)}</td><td><span class="badge ${x.trangThai==='ĐÃ ĐĂNG KÝ'?'ok':'cancel'}">${esc(x.trangThai)}</span></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Không có dữ liệu.</td></tr>'}
function logout(){sessionStorage.removeItem('adminRegistrationPassword');location.reload()}
document.getElementById('loginBtn').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()};document.getElementById('program').onchange=loadRows;document.getElementById('search').oninput=render;if(password){document.getElementById('password').value=password;login()}
</script></body></html>
