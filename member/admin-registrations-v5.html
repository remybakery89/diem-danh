<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Duyệt đăng ký V5</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px 16px 40px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}h1,h2,p{margin-top:0}.muted{color:#6b7280}input,select,button{min-height:44px;border-radius:11px;font:inherit}input,select{width:100%;border:1px solid #d1d5db;padding:0 12px}button{border:0;background:#111827;color:#fff;font-weight:700;padding:0 14px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:12px;border-radius:14px;background:#f9fafb;text-align:center}.num{font-size:24px;font-weight:800}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;vertical-align:top}th{font-size:13px;color:#6b7280}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.di{background:#dcfce7;color:#166534}.khongdi{background:#fee2e2;color:#991b1b}.dubi,.pending{background:#fef3c7;color:#92400e}.cancel{background:#e5e7eb;color:#4b5563}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{min-height:38px}.error{padding:10px;border-radius:10px;background:#fee2e2;color:#991b1b}.success{padding:10px;border-radius:10px;background:#dcfce7;color:#166534}@media(max-width:750px){.row,.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.row,.stats{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="card" id="loginCard"><h1>Quản lý đăng ký</h1><p class="muted">Vòng 5 — duyệt trạng thái đăng ký.</p><input id="password" type="password" placeholder="Mật khẩu Admin"><button id="loginBtn" style="margin-top:10px;width:100%">Đăng nhập</button><div id="msg" class="hidden"></div></div>
<div id="app" class="hidden">
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>Duyệt đăng ký V5</h1><p id="programTitle" class="muted">Chọn chương trình.</p></div><button onclick="logout()">Đăng xuất</button></div></div>
<div class="card"><div class="row"><div><label>Chương trình</label><select id="program"></select></div><div><label>Lọc trạng thái</label><select id="filter"><option value="ALL">Tất cả</option><option value="CHỜ DUYỆT">Chờ duyệt</option><option value="ĐI">ĐI</option><option value="KHÔNG ĐI">KHÔNG ĐI</option><option value="DỰ BỊ">DỰ BỊ</option><option value="ĐÃ HỦY">Đã hủy</option></select></div></div><button onclick="loadRows()" style="margin-top:10px;width:100%">Làm mới</button></div>
<div class="card"><div class="stats"><div class="stat"><div class="num" id="di">0</div><div>ĐI</div></div><div class="stat"><div class="num" id="khongDi">0</div><div>KHÔNG ĐI</div></div><div class="stat"><div class="num" id="duBi">0</div><div>DỰ BỊ</div></div><div class="stat"><div class="num" id="pending">0</div><div>CHỜ DUYỆT</div></div><div class="stat"><div class="num" id="cancelled">0</div><div>ĐÃ HỦY</div></div></div></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>Ca viên</th><th>Trạng thái</th><th>Yêu cầu</th><th>Lý do</th><th>Cập nhật</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbw3vjfqpTIB5U8Kqij9Fa1FtR7RFA-QAreYjl0wBrVkWjGQL6QOyCdP-NtPgwi78lmdHA/exec';
let password=sessionStorage.getItem('adminRegistrationPasswordV5')||'',rows=[],programs=[];
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),q=new URLSearchParams({...params,callback:cb}),timer=setTimeout(()=>{cleanup();reject(new Error('Kết nối máy chủ quá lâu.'))},15000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=d=>{cleanup();resolve(d)};script.onerror=()=>{cleanup();reject(new Error('Không kết nối được máy chủ.'))};script.src=API+'?'+q;document.body.appendChild(script)})}
function msg(text,ok){const e=document.getElementById('msg');e.textContent=text;e.className=ok?'success':'error';e.classList.remove('hidden')}
async function login(){const p=document.getElementById('password').value;if(!p)return msg('Vui lòng nhập mật khẩu.');document.getElementById('loginBtn').disabled=true;try{const r=await jsonp({api:'registration_v5_admin',password:p});if(!r.success)return msg(r.message||'Mật khẩu không đúng.');password=p;sessionStorage.setItem('adminRegistrationPasswordV5',p);document.getElementById('loginCard').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadPrograms()}catch(e){msg(e.message)}finally{document.getElementById('loginBtn').disabled=false}}
async function loadPrograms(){const r=await jsonp({api:'registration_programs'});if(!r.success)throw new Error(r.message||'Không tải được chương trình.');programs=r.programs||[];const s=document.getElementById('program');s.innerHTML='<option value="">Chọn chương trình</option>'+programs.map(p=>`<option value="${esc(p.maBuoi)}">${esc(p.tenBuoi)} — ${esc(p.maBuoi)}</option>`).join('');if(programs.length){s.value=programs[0].maBuoi;await loadRows()}}
function badge(status){const cls=status==='ĐI'?'di':status==='KHÔNG ĐI'?'khongdi':status==='DỰ BỊ'?'dubi':status==='CHỜ DUYỆT'?'pending':'cancel';return '<span class="badge '+cls+'">'+esc(status)+'</span>'}
async function loadRows(){const maBuoi=document.getElementById('program').value;if(!maBuoi){rows=[];render();return}const r=await jsonp({api:'registration_v5_admin',password,maBuoi});if(!r.success){alert(r.message||'Không tải được dữ liệu.');return}rows=r.rows||[];document.getElementById('di').textContent=r.stats?.di||0;document.getElementById('khongDi').textContent=r.stats?.khongDi||0;document.getElementById('duBi').textContent=r.stats?.duBi||0;document.getElementById('pending').textContent=r.stats?.choDuyet||0;document.getElementById('cancelled').textContent=r.stats?.daHuy||0;const p=programs.find(x=>x.maBuoi===maBuoi)||{};document.getElementById('programTitle').textContent=(p.tenBuoi||maBuoi)+' — '+(p.ngay||'')+(p.gio?' · '+p.gio:'');render()}
function render(){const f=document.getElementById('filter').value;const list=rows.filter(x=>f==='ALL'||x.trangThai===f);document.getElementById('rows').innerHTML=list.length?list.map(x=>{const action=x.trangThai==='CHỜ DUYỆT'?'<div class="actions"><button onclick="approve(\''+encodeURIComponent(x.maDangKy)+'\',\'ĐI\')">Duyệt ĐI</button><button onclick="approve(\''+encodeURIComponent(x.maDangKy)+'\',\'KHÔNG ĐI\')">Duyệt KHÔNG ĐI</button><button onclick="approve(\''+encodeURIComponent(x.maDangKy)+'\',\'DỰ BỊ\')">Duyệt DỰ BỊ</button></div>':'—';return '<tr><td><b>'+esc(x.hoTen)+'</b><br><span class="muted">'+esc(x.ma)+' · '+esc(x.be)+'</span></td><td>'+badge(x.trangThai)+'</td><td>'+esc(x.trangThaiYeuCau||'—')+'</td><td>'+esc(x.lyDo||'—')+'</td><td>'+esc(x.thoiGianCapNhat||x.thoiGian||'—')+'</td><td>'+action+'</td></tr>'}).join(''):'<tr><td colspan="6" class="muted">Không có dữ liệu.</td></tr>'}
async function approve(encoded,status){const maDangKy=decodeURIComponent(encoded);if(!confirm('Xác nhận duyệt '+status+'?'))return;try{const r=await jsonp({api:'registration_v5_approve',password,maDangKy,trangThai:status});if(!r.success){alert(r.message||'Không duyệt được.');return}await loadRows()}catch(e){alert(e.message||'Không duyệt được.')}}
function logout(){sessionStorage.removeItem('adminRegistrationPasswordV5');location.reload()}
document.getElementById('loginBtn').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login();};document.getElementById('program').onchange=loadRows;document.getElementById('filter').onchange=render;if(password){document.getElementById('password').value=password;login()}
</script></body></html>
