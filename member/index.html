<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Ca viên - Đăng ký chương trình</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}
    h1,h2,p{margin-top:0}.muted{color:#6b7280}.hidden{display:none!important}
    input,button{width:100%;min-height:48px;border-radius:12px;font:inherit}input{border:1px solid #d1d5db;padding:0 14px;margin:6px 0 10px}button{border:0;background:#111827;color:#fff;font-weight:700;padding:0 14px;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}button:disabled{opacity:.55;cursor:not-allowed}
    .row{display:flex;gap:10px}.row>*{flex:1}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:13px;font-weight:700}.program{padding:15px 0;border-top:1px solid #eee}.program:first-child{border-top:0}.program h3{margin:0 0 6px}.program p{margin:4px 0}.status{font-weight:700}.ok{color:#15803d}.warn{color:#b45309}.danger-text{color:#b91c1c}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{width:auto;min-height:40px}.notice{padding:12px;border-radius:12px;background:#f9fafb;margin:10px 0}.small{font-size:13px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card" id="loginCard">
    <h1>Ca viên</h1>
    <p class="muted">Đăng nhập để xem và đăng ký các chương trình.</p>
    <label>Mã ca viên</label>
    <input id="memberCode" placeholder="Ví dụ: SC00125" autocomplete="username" autocapitalize="characters">
    <label>4 số cuối SĐT</label>
    <input id="last4" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="current-password">
    <button id="loginBtn">Đăng nhập</button>
    <div id="loginMsg" class="notice hidden"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <div class="top"><div><h1 id="memberName">Ca viên</h1><p id="memberInfo" class="muted"></p></div><button class="secondary" id="logoutBtn">Đăng xuất</button></div>
    </div>

    <div class="card">
      <div class="top"><div><h2>Chương trình</h2><p class="muted">Các chương trình lấy trực tiếp từ hệ thống <b>BUOI</b>.</p></div><button class="secondary" id="refreshBtn">Làm mới</button></div>
      <div id="programs"></div>
    </div>

    <div class="card">
      <h2>Đăng ký của tôi</h2>
      <div id="mine"></div>
    </div>
  </div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw3vjfqpTIB5U8Kqij9Fa1FtR7RFA-QAreYjl0wBrVkWjGQL6QOyCdP-NtPgwi78lmdHA/exec';
let token = sessionStorage.getItem('memberRegistrationToken') || '';
let member = JSON.parse(sessionStorage.getItem('memberRegistrationMember') || 'null');

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const query=new URLSearchParams({...params,callback:cb});
    const timer=setTimeout(()=>{cleanup();reject(new Error('Kết nối máy chủ quá lâu.'));},15000);
    function cleanup(){clearTimeout(timer);delete window[cb];script.remove();}
    window[cb]=(data)=>{cleanup();resolve(data)};
    script.onerror=()=>{cleanup();reject(new Error('Không kết nối được máy chủ.'))};
    script.src=API+'?'+query.toString();
    document.body.appendChild(script);
  });
}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function show(id,text,kind=''){const el=document.getElementById(id);el.textContent=text;el.className='notice '+(kind||'');el.classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function setLoggedIn(){document.getElementById('loginCard').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('memberName').textContent=member?.hoTen||'Ca viên';document.getElementById('memberInfo').textContent=(member?.ma||'')+(member?.be?' · '+member.be:'')}
function logout(){sessionStorage.removeItem('memberRegistrationToken');sessionStorage.removeItem('memberRegistrationMember');token='';member=null;location.reload()}
async function login(){
  const ma=document.getElementById('memberCode').value.trim().toUpperCase();
  const last4=document.getElementById('last4').value.trim();
  hide('loginMsg');
  if(!/^SC\d+$/.test(ma)||!/^[0-9]{4}$/.test(last4)){show('loginMsg','Vui lòng nhập đúng mã SCxxxxx và 4 số cuối SĐT.','warn');return}
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Đang đăng nhập...';
  try{
    const r=await jsonp({api:'registration_login',ma,last4});
    if(!r.success){show('loginMsg',r.message||'Đăng nhập thất bại.','danger-text');return}
    token=r.token;member=r.member;sessionStorage.setItem('memberRegistrationToken',token);sessionStorage.setItem('memberRegistrationMember',JSON.stringify(member));setLoggedIn();await refreshAll();
  }catch(e){show('loginMsg',e.message,'danger-text')}finally{btn.disabled=false;btn.textContent='Đăng nhập'}
}
function programStatus(p){const s=String(p.trangThai||'');let cls=s==='ĐANG MỞ'?'ok':(s==='ĐÃ ĐÓNG'||s==='ĐÃ KẾT THÚC'?'danger-text':'warn');return `<span class="status ${cls}">${esc(s)}</span>`}
function renderPrograms(list){
  const box=document.getElementById('programs');
  if(!list?.length){box.innerHTML='<p class="muted">Chưa có chương trình.</p>';return}
  box.innerHTML=list.map(p=>{
    const mine=currentMine.find(x=>x.maBuoi===p.maBuoi&&x.trangThai==='ĐÃ ĐĂNG KÝ');
    const canRegister=p.trangThai==='ĐANG MỞ' && !mine;
    return `<div class="program"><h3>${esc(p.tenBuoi)}</h3><p>📅 ${esc(p.ngay)}${p.gio?' · '+esc(p.gio):''}</p>${p.diaDiem?`<p>📍 ${esc(p.diaDiem)}</p>`:''}<p>${programStatus(p)}${p.gioiHan?' · Giới hạn '+esc(p.gioiHan):''}${p.doiTuong&&p.doiTuong!=='TẤT CẢ'?' · '+esc(p.doiTuong):''}</p>${p.ghiChu?`<p class="muted small">${esc(p.ghiChu)}</p>`:''}<div style="margin-top:10px">${mine?`<div class="row"><span class="badge ok" style="align-self:center">Đã đăng ký</span><button class="danger" onclick="cancelProgram('${encodeURIComponent(p.maBuoi)}')">Hủy đăng ký</button></div>`:canRegister?`<button onclick="registerProgram('${encodeURIComponent(p.maBuoi)}')">Đăng ký</button>`:'<button disabled>Không thể đăng ký</button>'}</div></div>`;
  }).join('');
}
let currentPrograms=[];let currentMine=[];
async function loadPrograms(){const r=await jsonp({api:'registration_programs'});if(!r.success)throw new Error(r.message||'Không tải được chương trình.');currentPrograms=r.programs||[];renderPrograms(currentPrograms)}
async function loadMine(){const r=await jsonp({api:'registration_mine',token});if(!r.success){if(r.type==='SESSION_EXPIRED'){logout();return}throw new Error(r.message||'Không tải được đăng ký.')}currentMine=r.registrations||[];document.getElementById('mine').innerHTML=currentMine.length?currentMine.map(x=>`<div class="program"><b>${esc(x.tenBuoi||x.maBuoi)}</b><p class="muted small">${esc(x.ngay||'')}${x.gio?' · '+esc(x.gio):''}</p><p>${x.trangThai==='ĐÃ ĐĂNG KÝ'?'<span class="ok">✓ Đã đăng ký</span>':'<span class="muted">Đã hủy</span>'}</p>${x.trangThai==='ĐÃ ĐĂNG KÝ'?`<button class="danger" onclick="cancelProgram('${encodeURIComponent(x.maBuoi)}')">Hủy đăng ký</button>`:''}</div>`).join(''):'<p class="muted">Bạn chưa có đăng ký nào.</p>'}
async function refreshAll(){try{await loadMine();await loadPrograms()}catch(e){show('programs',e.message,'danger-text')}}
async function registerProgram(encoded){const maBuoi=decodeURIComponent(encoded);if(!confirm('Xác nhận đăng ký chương trình này?'))return;try{const r=await jsonp({api:'registration_create',token,maBuoi});if(!r.success){alert(r.message||'Không đăng ký được.');return}alert(r.message||'Đăng ký thành công.');await refreshAll()}catch(e){alert(e.message)}}
async function cancelProgram(encoded){const maBuoi=decodeURIComponent(encoded);if(!confirm('Bạn có chắc muốn hủy đăng ký chương trình này?'))return;try{const r=await jsonp({api:'registration_cancel',token,maBuoi});if(!r.success){alert(r.message||'Không thể hủy đăng ký.');return}alert(r.message||'Đã hủy đăng ký.');await refreshAll()}catch(e){alert(e.message)}}
window.registerProgram=registerProgram;window.cancelProgram=cancelProgram;
document.getElementById('loginBtn').onclick=login;document.getElementById('logoutBtn').onclick=logout;document.getElementById('refreshBtn').onclick=refreshAll;document.getElementById('last4').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,4));
if(token&&member){setLoggedIn();refreshAll().catch(()=>{})}
</script>
</body>
</html>
