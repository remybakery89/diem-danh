<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Admin - Chi tiết chương trình</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px 14px 42px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}h1,h2,p{margin-top:0}.muted{color:#6b7280}.hidden{display:none!important}button,input{min-height:44px;border-radius:11px;font:inherit}button{border:0;background:#111827;color:#fff;font-weight:700;padding:0 15px;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}input{border:1px solid #d1d5db;padding:0 12px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{width:auto}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#f9fafb;text-align:center}.num{font-size:25px;font-weight:800}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;white-space:nowrap}th{font-size:13px;color:#6b7280}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.ok{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.cancel{background:#fee2e2;color:#991b1b}.notice{padding:11px;border-radius:11px;margin-top:10px}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<div class="card" id="loginCard"><h1>Chi tiết chương trình</h1><p class="muted">Đăng nhập Admin để xem đăng ký, điểm danh và xuất danh sách.</p><input id="password" type="password" placeholder="Mật khẩu Admin" autocomplete="current-password"><button id="loginBtn" style="width:100%;margin-top:10px">Đăng nhập</button><div id="msg" class="notice hidden"></div></div>
<div id="app" class="hidden">
<div class="card"><div class="top"><div><h1 id="title">Chương trình</h1><p id="meta" class="muted"></p></div><button class="secondary" onclick="back()">← Danh sách</button></div></div>
<div class="card"><div class="stats"><div class="stat"><div class="num" id="registered">0</div><div>Đã đăng ký</div></div><div class="stat"><div class="num" id="present">0</div><div>Đã điểm danh</div></div><div class="stat"><div class="num" id="pending">0</div><div>Chưa điểm danh</div></div><div class="stat"><div class="num" id="cancelled">0</div><div>Đã hủy</div></div></div></div>
<div class="card"><div class="toolbar"><div><label>Tìm kiếm</label><input id="search" placeholder="Tên, mã ca viên, bè..."></div><button onclick="loadRows()">Làm mới</button><button onclick="exportCsv()">Xuất CSV</button></div></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Họ tên</th><th>Bè</th><th>Đăng ký</th><th>Điểm danh</th><th>Phương thức</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbw3vjfqpTIB5U8Kqij9Fa1FtR7RFA-QAreYjl0wBrVkWjGQL6QOyCdP-NtPgwi78lmdHA/exec';
let password=sessionStorage.getItem('adminRegistrationPassword')||'';let dataRows=[];let program=null;
const params=new URLSearchParams(location.search);const maBuoi=params.get('maBuoi')||sessionStorage.getItem('adminSelectedProgram')||'';
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');const q=new URLSearchParams({...params,callback:cb});const timer=setTimeout(()=>{cleanup();reject(new Error('Kết nối máy chủ quá lâu.'))},15000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=d=>{cleanup();resolve(d)};script.onerror=()=>{cleanup();reject(new Error('Không kết nối được máy chủ.'))};script.src=API+'?'+q;document.body.appendChild(script)})}
function msg(text,ok=false){const e=document.getElementById('msg');e.textContent=text;e.className='notice '+(ok?'success':'error');e.classList.remove('hidden')}
async function login(){const p=document.getElementById('password').value;if(!p)return msg('Vui lòng nhập mật khẩu.');document.getElementById('loginBtn').disabled=true;try{const r=await jsonp({api:'registration_admin',password:p});if(!r.success){msg(r.message||'Mật khẩu không đúng.');return}password=p;sessionStorage.setItem('adminRegistrationPassword',p);document.getElementById('loginCard').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadRows()}catch(e){msg(e.message)}finally{document.getElementById('loginBtn').disabled=false}}
async function loadRows(){if(!maBuoi){msg('Thiếu mã chương trình.');return}const r=await jsonp({api:'registration_attendance_admin',password,maBuoi});if(!r.success){msg(r.message||'Không tải được dữ liệu.');return}program=r.program||{};dataRows=r.rows||[];document.getElementById('title').textContent=program.tenBuoi||maBuoi;document.getElementById('meta').textContent=[program.maBuoi,program.ngay,program.gio,program.diaDiem].filter(Boolean).join(' · ');document.getElementById('registered').textContent=r.stats?.daDangKy||0;document.getElementById('present').textContent=r.stats?.daDiemDanh||0;document.getElementById('pending').textContent=r.stats?.chuaDiemDanh||0;document.getElementById('cancelled').textContent=r.stats?.daHuy||0;render()}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=dataRows.filter(x=>!q||[x.ma,x.hoTen,x.be,x.trangThaiDangKy].join(' ').toLowerCase().includes(q));document.getElementById('rows').innerHTML=list.length?list.map(x=>{const reg=x.trangThaiDangKy==='ĐÃ ĐĂNG KÝ'?'<span class="badge ok">Đã đăng ký</span>':'<span class="badge cancel">Đã hủy</span>';const att=x.daDiemDanh?`<span class="badge ok">✓ ${esc(x.thoiGianDiemDanh)}</span>`:(x.trangThaiDangKy==='ĐÃ ĐĂNG KÝ'?'<span class="badge pending">Chưa điểm danh</span>':'<span class="muted">—</span>');return `<tr><td>${esc(x.ma)}</td><td>${esc(x.hoTen)}</td><td>${esc(x.be)}</td><td>${reg}<br><small class="muted">${esc(x.thoiGianDangKy)}</small></td><td>${att}</td><td>${esc(x.phuongThucDiemDanh||'—')}</td></tr>`}).join(''):'<tr><td colspan="6" class="muted">Không có dữ liệu.</td></tr>'}
function exportCsv(){const header=['Mã ca viên','Họ tên','Bè','Đăng ký','Thời gian đăng ký','Điểm danh','Thời gian điểm danh','Phương thức'];const lines=[header,...dataRows.map(x=>[x.ma,x.hoTen,x.be,x.trangThaiDangKy,x.thoiGianDangKy,x.daDiemDanh?'ĐÃ ĐIỂM DANH':'CHƯA ĐIỂM DANH',x.thoiGianDiemDanh||'',x.phuongThucDiemDanh||''])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(program?.maBuoi||'chuong-trinh')+'_dang-ky.csv';a.click();URL.revokeObjectURL(a.href)}
function back(){location.href='admin-dashboard.html'}
document.getElementById('loginBtn').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()};document.getElementById('search').oninput=render;if(password){document.getElementById('password').value=password;login()}
</script></body></html>
