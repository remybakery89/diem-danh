<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Thanh toán V5C</title>
<style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:20px 16px 40px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}h1,h2,p{margin-top:0}.muted{color:#6b7280}.hidden{display:none!important}.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}input,select,button{min-height:44px;border-radius:11px;font:inherit}input,select{width:100%;border:1px solid #d1d5db;padding:0 12px}button{border:0;background:#111827;color:#fff;font-weight:700;padding:0 14px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;vertical-align:top}th{font-size:13px;color:#6b7280}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.sent{background:#fef3c7;color:#92400e}.paid{background:#dcfce7;color:#166534}.none{background:#e5e7eb;color:#4b5563}.imgbtn{min-height:36px}.error{padding:10px;border-radius:10px;background:#fee2e2;color:#991b1b}.success{padding:10px;border-radius:10px;background:#dcfce7;color:#166534}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbox{background:#fff;border-radius:16px;padding:14px;max-width:900px;max-height:90vh;width:100%;overflow:auto}.modalbox img{display:block;max-width:100%;max-height:75vh;margin:auto}.amount{max-width:180px}@media(max-width:700px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}th,td{white-space:nowrap}}
</style></head><body><div class="wrap">
<div class="card" id="loginCard"><h1>Thanh toán V5C</h1><p class="muted">Xem ảnh giao dịch theo từng ca viên và tự nhập số tiền xác nhận.</p><input id="password" type="password" placeholder="Mật khẩu Admin"><button id="loginBtn" style="margin-top:10px;width:100%">Đăng nhập</button><div id="loginMsg" class="hidden"></div></div>
<div id="app" class="hidden"><div class="card"><div class="top"><div><h1>Quản lý thanh toán</h1><p id="programTitle" class="muted">Chọn chương trình.</p></div><div class="actions"><button onclick="location.href='admin-registrations-v5.html'">← Đăng ký V5</button><button onclick="location.href='admin-dashboard.html'">Dashboard</button><button onclick="logout()">Đăng xuất</button></div></div></div>
<div class="card"><div class="row"><div><label>Chương trình</label><select id="program"></select></div><div><label>Trạng thái thanh toán</label><select id="filter"><option value="ALL">Tất cả</option><option value="CHƯA NỘP">Chưa nộp</option><option value="ĐÃ GỬI">Đã gửi</option><option value="ĐÃ XÁC NHẬN">Đã xác nhận</option></select></div></div><button id="refreshBtn" style="margin-top:10px;width:100%">Làm mới</button></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>Ca viên</th><th>Đăng ký</th><th>Thanh toán</th><th>Ảnh giao dịch</th><th>Số tiền xác nhận</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeImage()"><div class="modalbox"><div class="top"><b>Ảnh giao dịch</b><button onclick="closeImage()">Đóng</button></div><div style="padding-top:12px"><img id="paymentImage" alt="Ảnh giao dịch"></div></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbw3vjfqpTIB5U8Kqij9Fa1FtR7RFA-QAreYjl0wBrVkWjGQL6QOyCdP-NtPgwi78lmdHA/exec';
let password=sessionStorage.getItem('adminPaymentPasswordV5C')||'', rows=[], programs=[];
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='payadmin_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),q=new URLSearchParams({...params,callback:cb}),timer=setTimeout(()=>{cleanup();reject(new Error('Kết nối máy chủ quá lâu.'))},15000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=d=>{cleanup();resolve(d)};script.onerror=()=>{cleanup();reject(new Error('Không kết nối được máy chủ.'))};script.src=API+'?'+q;document.body.appendChild(script)})}
function loginMsg(text,ok){const e=document.getElementById('loginMsg');e.textContent=text;e.className=ok?'success':'error';e.classList.remove('hidden')}
async function login(){const p=document.getElementById('password').value;if(!p)return loginMsg('Vui lòng nhập mật khẩu.');document.getElementById('loginBtn').disabled=true;try{const r=await jsonp({api:'registration_v5_admin',password:p});if(!r.success)return loginMsg(r.message||'Mật khẩu không đúng.');password=p;sessionStorage.setItem('adminPaymentPasswordV5C',p);document.getElementById('loginCard').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadPrograms()}catch(e){loginMsg(e.message)}finally{document.getElementById('loginBtn').disabled=false}}
async function loadPrograms(){const r=await jsonp({api:'registration_programs'});if(!r.success)throw new Error(r.message||'Không tải được chương trình.');programs=r.programs||[];const s=document.getElementById('program');s.innerHTML='<option value="">Chọn chương trình</option>'+programs.map(p=>`<option value="${esc(p.maBuoi)}">${esc(p.tenBuoi)} — ${esc(p.maBuoi)}</option>`).join('');if(programs.length){s.value=programs[0].maBuoi;await loadRows()}}
function badge(s){const cls=s==='ĐÃ XÁC NHẬN'?'paid':s==='ĐÃ GỬI'?'sent':'none';return '<span class="badge '+cls+'">'+esc(s||'CHƯA NỘP')+'</span>'}
async function loadRows(){const maBuoi=document.getElementById('program').value;if(!maBuoi){rows=[];render();return}const r=await jsonp({api:'registration_v5_payment_admin',password,maBuoi});if(!r.success){alert(r.message||'Không tải được thanh toán.');return}rows=r.registrations||[];const p=programs.find(x=>x.maBuoi===maBuoi)||{};document.getElementById('programTitle').textContent=(p.tenBuoi||maBuoi)+' — '+(p.ngay||'')+(p.gio?' · '+p.gio:'');render()}
function render(){const f=document.getElementById('filter').value;const list=rows.map((x,i)=>({x,i})).filter(o=>f==='ALL'||(o.x.payment?.trangThaiThanhToan||'CHƯA NỘP')===f);document.getElementById('rows').innerHTML=list.length?list.map(o=>{const x=o.x,i=o.i,p=x.payment||{},st=p.trangThaiThanhToan||'CHƯA NỘP',image=p.anhGiaoDich?'<button class="imgbtn" onclick="showImage('+JSON.stringify(p.anhGiaoDich)+')">Xem ảnh</button>':'<span class="muted">Chưa có</span>';const canConfirm=!!p.anhGiaoDich;return '<tr><td><b>'+esc(x.hoTen)+'</b><br><span class="muted">'+esc(x.ma)+' · '+esc(x.be)+'</span></td><td>'+esc(x.trangThai||'—')+'</td><td>'+badge(st)+(p.thoiGianXacNhan?'<div class="muted small">'+esc(p.thoiGianXacNhan)+'</div>':'')+'</td><td>'+image+'</td><td><input class="amount" id="amount_'+i+'" value="'+esc(p.soTienXacNhan||'')+'" inputmode="decimal" placeholder="Nhập số tiền"></td><td><button '+(canConfirm?'':'disabled')+' onclick="confirmPayment('+i+')">'+(st==='ĐÃ XÁC NHẬN'?'Cập nhật xác nhận':'Xác nhận')+'</button></td></tr>'}).join(''):'<tr><td colspan="6" class="muted">Không có dữ liệu.</td></tr>'}
async function confirmPayment(i){const x=rows[i],amount=document.getElementById('amount_'+i).value.trim();if(!amount){alert('Vui lòng nhập số tiền xác nhận.');return}if(!confirm('Xác nhận số tiền '+amount+' cho '+x.hoTen+'?'))return;try{const r=await jsonp({api:'registration_v5_payment_confirm',password,maBuoi:x.maBuoi,ma:x.ma,soTienXacNhan:amount});if(!r.success){alert(r.message||'Không xác nhận được.');return}await loadRows()}catch(e){alert(e.message||'Không xác nhận được.')}}
function showImage(url){document.getElementById('paymentImage').src=url;document.getElementById('modal').classList.remove('hidden')}
function closeImage(){document.getElementById('paymentImage').removeAttribute('src');document.getElementById('modal').classList.add('hidden')}
function logout(){sessionStorage.removeItem('adminPaymentPasswordV5C');location.reload()}
document.getElementById('loginBtn').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()};document.getElementById('program').onchange=loadRows;document.getElementById('filter').onchange=render;document.getElementById('refreshBtn').onclick=loadRows;if(password){document.getElementById('password').value=password;login()}
</script></body></html>
