<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quét QR điểm danh</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f3f5f8;font-family:Arial,sans-serif;color:#202124}
    .top{background:#fff;padding:16px 18px;border-bottom:1px solid #ddd}
    .top h1{margin:0;font-size:21px}
    .wrap{max-width:620px;margin:auto;padding:16px}
    .card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 3px 16px rgba(0,0,0,.08)}
    #reader{width:100%;overflow:hidden;border-radius:14px}
    .hint{text-align:center;color:#666;padding:12px 4px 4px}
    .status{display:none;margin-top:14px;padding:18px;border-radius:14px;text-align:center}
    .success{display:block;background:#e8f5e9;color:#087f23}
    .warning{display:block;background:#fff8e1;color:#8a6200}
    .error{display:block;background:#ffebee;color:#c62828}
    .icon{font-size:38px}.title{font-size:21px;font-weight:700}
    .name{font-size:27px;font-weight:700;margin-top:7px}
    .meta{margin-top:5px}.code{font-weight:700;letter-spacing:1px;margin-top:8px}
    .small{font-size:13px;margin-top:7px}
  </style>
</head>
<body>
  <div class="top"><h1>📷 Quét QR điểm danh</h1></div>
  <div class="wrap">
    <div class="card">
      <div id="reader"></div>
      <div class="hint">Đưa mã QR vào khung. Quét xong hệ thống tự điểm danh.</div>
      <div id="status" class="status"></div>
    </div>
  </div>

<script>
/*
 * DÁN URL WEB APP APPS SCRIPT CỦA BẠN VÀO ĐÂY.
 * Ví dụ: https://script.google.com/macros/s/XXXXX/exec
 */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhd551ivVpB2GvNiMsabSUdMfNTb2gp1Tw1uSsJ9k9CF16iZPbs4hG9-n2hsdMfVjHIA/exec";

let scanner;
let busy = false;
let lastCode = "";

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function show(type, icon, title, name="", be="", code="", time=""){
  const box = document.getElementById("status");
  box.className = "status " + type;
  box.innerHTML =
    `<div class="icon">${icon}</div>
     <div class="title">${esc(title)}</div>
     ${name ? `<div class="name">${esc(name)}</div>` : ""}
     ${be ? `<div class="meta">${esc(be)}</div>` : ""}
     ${code ? `<div class="code">${esc(code)}</div>` : ""}
     ${time ? `<div class="small">${esc(time)}</div>` : ""}`;
}

function hideStatus(){
  const box = document.getElementById("status");
  box.className = "status";
  box.innerHTML = "";
}

/*
 * JSONP: dùng <script> thay vì fetch để tránh lỗi CORS.
 * Apps Script sẽ gọi hàm callback với kết quả check-in.
 */
function callCheckIn(code){
  const callbackName = "checkInCallback_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(result){
    try {
      handleResult(result, code);
    } finally {
      delete window[callbackName];
      script.remove();
    }
  };

  script.onerror = function(){
    busy = false;
    show("error","❌","Không kết nối được hệ thống","",
         "Kiểm tra URL Web App hoặc kết nối mạng.");
    delete window[callbackName];
    script.remove();
    setTimeout(hideStatus, 2500);
  };

  script.src =
    APPS_SCRIPT_URL +
    "?api=checkin" +
    "&code=" + encodeURIComponent(code) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&_=" + Date.now();

  document.body.appendChild(script);
}

function handleResult(result, code){
  if (result && result.success === true){
    show("success","🟢","ĐIỂM DANH THÀNH CÔNG",
         result.hoTen || "", result.be || "", result.ma || code,
         result.thoiGian || "");
    beep();
  } else if (result && result.type === "DUPLICATE"){
    show("warning","🟡","ĐÃ ĐIỂM DANH RỒI",
         result.hoTen || "", result.be || "", result.ma || code,
         result.thoiGianCu || "");
    beep(330, 0.12);
  } else {
    show("error","❌",
         result?.message || "Không thể điểm danh",
         result?.hoTen || "", result?.be || "", result?.ma || code);
  }

  setTimeout(() => {
    busy = false;
    lastCode = "";
    hideStatus();
  }, 1600);
}

function beep(freq=880, duration=.10){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    const ctx = new C();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = "sine";
    gain.gain.value = .08;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }catch(e){}
}

function onScan(decodedText){
  const code = String(decodedText || "").trim().toUpperCase();

  if (busy) return;
  if (!/^SC\d+$/i.test(code)){
    show("error","❌","Mã QR không hợp lệ", "", "", code);
    setTimeout(hideStatus, 1400);
    return;
  }
  if (code === lastCode) return;

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("DAN_URL")){
    show("error","❌","Chưa cấu hình URL hệ thống",
         "Mở file và điền APPS_SCRIPT_URL.");
    return;
  }

  busy = true;
  lastCode = code;
  show("warning","⏳","ĐANG ĐIỂM DANH","", "", code);
  callCheckIn(code);
}

function start(){
  scanner = new Html5Qrcode("reader");
  scanner.start(
    {facingMode:"environment"},
    {fps:10, qrbox:{width:250,height:250}},
    onScan,
    () => {}
  ).catch(err => {
    show("error","❌","Không mở được camera",
         "Hãy mở trang bằng Chrome/Safari và cho phép Camera.");
  });
}

window.addEventListener("load", start);
</script>
</body>
</html>
