<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Điểm danh ca viên</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f5f8;
      font-family: Arial, sans-serif;
      color: #202124;
    }

    .app {
      max-width: 620px;
      margin: auto;
      padding: 14px 16px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .admin-btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      background: white;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .session {
      margin-top: 7px;
      color: #6b7280;
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: white;
      border-radius: 15px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
    }

    .stat-label {
      margin-top: 4px;
      font-size: 12px;
      color: #6b7280;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    .mode {
      border: 2px solid #e0e3e7;
      background: white;
      border-radius: 12px;
      padding: 13px 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .mode.active {
      border-color: #4285f4;
      background: #eaf2ff;
      color: #1967d2;
    }

    .scanner-panel {
      display: none;
    }

    .scanner-panel.active {
      display: block;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
      min-height: 260px;
    }

    .scanner-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .scan-button,
    .stop-button {
      flex: 1;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .scan-button {
      background: #4285f4;
      color: white;
    }

    .stop-button {
      background: #e8eaed;
      color: #333;
    }

    .scanner-hint {
      text-align: center;
      color: #666;
      margin: 12px 0 3px;
      font-size: 14px;
    }

    .manual-panel {
      display: none;
    }

    .manual-panel.active {
      display: block;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 17px;
      border: 2px solid #dadce0;
      border-radius: 13px;
      font-size: 25px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #4285f4;
    }

    button.checkin {
      width: 100%;
      margin-top: 13px;
      padding: 17px;
      border: 0;
      border-radius: 13px;
      background: #4285f4;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button.checkin:disabled {
      opacity: .6;
    }

    .hint {
      text-align: center;
      color: #666;
      margin-top: 11px;
      font-size: 13px;
    }

    #result {
      margin-top: 18px;
    }

    .result-card {
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .success-card {
      background: #e8f5e9;
      color: #137333;
    }

    .duplicate-card {
      background: #fff8e1;
      color: #9a6700;
    }

    .error-card {
      background: #fce8e6;
      color: #c5221f;
    }

    .result-icon {
      font-size: 36px;
    }

    .result-title {
      font-size: 20px;
      font-weight: bold;
      margin-top: 7px;
    }

    .result-name {
      font-size: 27px;
      font-weight: bold;
      margin-top: 10px;
    }

    .result-info {
      margin-top: 6px;
      font-size: 15px;
    }

    .multiple-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .person {
      width: 100%;
      background: white;
      border: 2px solid #ddd;
      border-radius: 13px;
      padding: 14px;
      margin-top: 8px;
      text-align: left;
      cursor: pointer;
    }

    .person-name {
      font-weight: bold;
      font-size: 18px;
    }

    .person-be {
      color: #666;
      margin-top: 4px;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 12px;
    }

    @media (max-width: 500px) {
      .app { padding: 10px 12px 35px; }
      .brand { font-size: 18px; }
      .header h1 { font-size: 24px; }
      .card { padding: 16px; }
      .admin-btn { padding: 9px 10px; font-size: 12px; }
      .stat-number { font-size: 22px; }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="brand">🎵 Điểm danh Thuận Phát</div>

    <button class="admin-btn" onclick="goAdmin()">
      📊 Quản trị
    </button>
  </div>

  <div class="header">
    <h1>Điểm danh ca viên</h1>
    <div class="session" id="session">
      Đang tải thông tin buổi...
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-number" id="total">-</div>
      <div class="stat-label">Tổng active</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="present">-</div>
      <div class="stat-label">Đã có mặt</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="absent">-</div>
      <div class="stat-label">Chưa có mặt</div>
    </div>
  </div>

  <div class="card">

    <div class="modes">
      <button class="mode active" id="modeQR" onclick="setMode('qr')">
        📷 Quét QR
      </button>

      <button class="mode" id="modeManual" onclick="setMode('manual')">
        🔢 Nhập mã / SĐT
      </button>
    </div>

    <!-- QR -->
    <div class="scanner-panel active" id="qrPanel">

      <div id="reader"></div>

      <div class="scanner-actions">
        <button class="scan-button" id="startScanButton" onclick="startScanner()">
          📷 Bắt đầu quét
        </button>

        <button class="stop-button" onclick="stopScanner()">
          ⏹ Dừng camera
        </button>
      </div>

      <div class="scanner-hint">
        Đưa mã QR của ca viên vào khung để điểm danh
      </div>

    </div>

    <!-- NHẬP -->
    <div class="manual-panel" id="manualPanel">

      <label for="input">
        Nhập mã SCxxx hoặc 4 số cuối SĐT
      </label>

      <input
        id="input"
        type="text"
        inputmode="text"
        maxlength="20"
        placeholder="SC001 hoặc 0001"
        autocomplete="off"
        onkeydown="handleEnter(event)"
      >

      <button
        class="checkin"
        id="checkinButton"
        onclick="submitCheckIn()">
        ĐIỂM DANH
      </button>

      <div class="hint">
        SC001 → mã cá nhân &nbsp;•&nbsp; 0001 → 4 số cuối SĐT
      </div>

    </div>

    <div id="result"></div>

  </div>
</div>

<script>

let currentMode = 'qr';
let scanner = null;
let scannerRunning = false;
let processing = false;
let audioContext = null;


/* ================================
   ÂM THANH
================================ */

function unlockAudio() {

  try {

    if (!audioContext) {
      audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();
    }

    if (audioContext.state === 'suspended') {
      return audioContext.resume();
    }

  } catch (e) {
    // Không để lỗi âm thanh ảnh hưởng điểm danh.
  }

}

/*
 * Một lần tương tác với trang sẽ mở khóa âm thanh cho các lần quét sau.
 * Đây là yêu cầu của Chrome/Android và giúp giảm tình trạng quét thành công
 * nhưng không phát tiếng.
 */
function enableAudioFromUserGesture() {
  unlockAudio();
}

['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function(eventName) {
  document.addEventListener(eventName, enableAudioFromUserGesture, {
    passive: true,
    once: false
  });
});

function playTone(frequency, duration, delay) {

  if (!audioContext) return;

  const now = audioContext.currentTime + (delay || 0);

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.type = 'sine';
  oscillator.frequency.setValueAtTime(frequency, now);

  // To hơn bản cũ nhưng vẫn tránh âm thanh quá gắt.
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(0.38, now + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  oscillator.start(now);
  oscillator.stop(now + duration + 0.02);
}

function beep(type) {

  try {

    const result = unlockAudio();

    // Nếu Chrome đang resume AudioContext, phát sau khi resume xong.
    if (result && typeof result.then === 'function') {
      result.then(function() {
        beepNow(type);
      }).catch(function() {});
      return;
    }

    beepNow(type);

  } catch (e) {
    // Không để lỗi âm thanh làm hỏng điểm danh.
  }

}

function beepNow(type) {

  if (!audioContext || audioContext.state !== 'running') return;

  if (type === 'success') {
    // Thành công: 2 nốt cao, rõ ràng.
    playTone(1046, 0.12, 0);
    playTone(1318, 0.16, 0.13);

  } else if (type === 'duplicate') {
    // Trùng: 2 nốt thấp, khác hẳn tiếng thành công.
    playTone(660, 0.14, 0);
    playTone(523, 0.18, 0.15);

  } else if (type === 'error') {
    // Lỗi: 2 nốt thấp liên tiếp.
    playTone(330, 0.16, 0);
    playTone(220, 0.22, 0.17);

  } else {
    // QR vừa được nhận diện: bíp rất ngắn, nhỏ hơn các trạng thái.
    playTone(880, 0.06, 0);
  }

}


/* ================================
   ĐỔI PHƯƠNG THỨC
================================ */

function setMode(mode) {

  unlockAudio();

  if (mode === 'qr') {

    currentMode = 'qr';

    document.getElementById('modeQR')
      .classList.add('active');

    document.getElementById('modeManual')
      .classList.remove('active');

    document.getElementById('qrPanel')
      .classList.add('active');

    document.getElementById('manualPanel')
      .classList.remove('active');

    document.getElementById('result').innerHTML = '';

  } else {

    stopScanner();

    currentMode = 'manual';

    document.getElementById('modeManual')
      .classList.add('active');

    document.getElementById('modeQR')
      .classList.remove('active');

    document.getElementById('manualPanel')
      .classList.add('active');

    document.getElementById('qrPanel')
      .classList.remove('active');

    document.getElementById('result').innerHTML = '';

    setTimeout(function() {
      document.getElementById('input').focus();
    }, 50);

  }

}


/* ================================
   QR SCANNER
================================ */

function startScanner() {

  unlockAudio();

  if (scannerRunning) return;

  const reader =
    document.getElementById('reader');

  reader.innerHTML = '';

  scanner =
    new Html5Qrcode('reader');

  scanner.start(

    { facingMode: 'environment' },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    function() {
      // Bỏ qua lỗi đọc từng frame.
    }

  ).then(function() {

    scannerRunning = true;

    document.getElementById('startScanButton')
      .textContent = '📷 Đang quét...';

  }).catch(function(error) {

    scannerRunning = false;

    showError(
      'Không mở được camera. Hãy cấp quyền camera cho trình duyệt.'
    );

  });

}


function stopScanner() {

  if (!scanner) return;

  try {

    scanner.stop()
      .then(function() {

        scannerRunning = false;
        scanner.clear();

      })
      .catch(function() {

        scannerRunning = false;

      });

  } catch (e) {

    scannerRunning = false;

  }

  document.getElementById('startScanButton')
    .textContent = '📷 Bắt đầu quét';

}


/* ================================
   KHI QR ĐƯỢC NHẬN DIỆN
================================ */

function onScanSuccess(decodedText) {

  if (processing) return;

  const code =
    String(decodedText)
      .trim()
      .toUpperCase();

  // Bíp ngay khi camera nhận diện được QR.
  beep('scan');

  if (!/^SC\d+$/i.test(code)) {

    processing = true;

    beep('error');

    showError(
      'Mã QR không hợp lệ: ' + code
    );

    setTimeout(function() {
      processing = false;
    }, 1000);

    return;
  }

  processing = true;

  showWarning(
    'Đang điểm danh...',
    code
  );

  google.script.run

    .withSuccessHandler(function(result) {

      handleResult(result, 'QR');

    })

    .withFailureHandler(function(error) {

      processing = false;

      beep('error');

      showError(
        error.message ||
        'Không thể kết nối hệ thống.'
      );

    })

    .checkIn(code, 'QR');

}


/* ================================
   NHẬP MÃ / SĐT
================================ */

function handleEnter(event) {

  if (event.key === 'Enter') {
    submitCheckIn();
  }

}


function submitCheckIn() {

  unlockAudio();

  const input =
    document.getElementById('input');

  const button =
    document.getElementById('checkinButton');

  let value =
    input.value.trim();

  if (!value) {

    showError(
      'Vui lòng nhập mã SCxxx hoặc 4 số cuối SĐT.'
    );

    input.focus();

    return;
  }

  if (/^\d{4}$/.test(value)) {

    button.disabled = true;
    button.textContent = 'ĐANG KIỂM TRA...';

    document.getElementById('result').innerHTML = '';

    google.script.run

      .withSuccessHandler(function(result) {
        handleResult(result, 'SĐT');
      })

      .withFailureHandler(handleFailure)

      .checkInByPhoneLast4(value);

    return;
  }

  if (/^SC\d+$/i.test(value)) {

    button.disabled = true;
    button.textContent = 'ĐANG KIỂM TRA...';

    document.getElementById('result').innerHTML = '';

    google.script.run

      .withSuccessHandler(function(result) {
        handleResult(result, 'WEB');
      })

      .withFailureHandler(handleFailure)

      .checkIn(value.toUpperCase(), 'WEB');

    return;
  }

  showError(
    'Vui lòng nhập mã dạng SC001 hoặc đúng 4 số cuối SĐT.'
  );

}


/* ================================
   KẾT QUẢ
================================ */

function handleResult(data, source) {

  if (source !== 'QR') {
    resetButton();
  }

  if (!data) {

    processing = false;

    beep('error');

    showError('Không nhận được kết quả.');

    return;
  }

  if (data.success) {

    if (source === 'QR') {
      beep('success');
    } else {
      beep('success');
    }

    showSuccess(data);

    refreshDashboard();

    if (source === 'QR') {

      setTimeout(function() {

        processing = false;

        showWaiting();

      }, 1500);

    } else {

      clearInputLater();

    }

    return;
  }

  if (data.type === 'DUPLICATE') {

    beep('duplicate');

    showDuplicate(data);

    if (source === 'QR') {

      setTimeout(function() {

        processing = false;

        showWaiting();

      }, 1800);

    } else {

      clearInputLater();

    }

    return;
  }

  if (data.type === 'MULTIPLE_MATCHES') {

    beep('duplicate');

    showMultiple(data.matches);

    return;
  }

  beep('error');

  showError(
    data.message ||
    'Không thể điểm danh.'
  );

  if (source === 'QR') {

    setTimeout(function() {
      processing = false;
      showWaiting();
    }, 1500);

  }

}


/* ================================
   THÀNH CÔNG
================================ */

function showSuccess(data) {

  const result =
    document.getElementById('result');

  result.innerHTML = `

    <div class="result-card success-card">

      <div class="result-icon">🟢</div>

      <div class="result-title">
        ĐIỂM DANH THÀNH CÔNG
      </div>

      <div class="result-name">
        ${escapeHtml(data.hoTen || '')}
      </div>

      <div class="result-info">
        ${escapeHtml(data.be || '')}
      </div>

      <div class="result-info">
        ${escapeHtml(data.thoiGian || '')}
      </div>

    </div>
  `;

}


function showDuplicate(data) {

  const result =
    document.getElementById('result');

  result.innerHTML = `

    <div class="result-card duplicate-card">

      <div class="result-icon">🟡</div>

      <div class="result-title">
        ĐÃ ĐIỂM DANH
      </div>

      <div class="result-name">
        ${escapeHtml(data.hoTen || '')}
      </div>

      <div class="result-info">
        ${escapeHtml(data.be || '')}
      </div>

      <div class="result-info">
        Đã điểm danh lúc:
        <strong>
          ${escapeHtml(data.thoiGianCu || '')}
        </strong>
      </div>

    </div>
  `;

}


function showMultiple(matches) {

  const result =
    document.getElementById('result');

  let html = `

    <div class="result-card duplicate-card">

      <div class="multiple-title">
        CÓ NHIỀU CA VIÊN CÙNG 4 SỐ CUỐI
      </div>

      <div class="result-info">
        Hãy chọn đúng người:
      </div>
  `;

  matches.forEach(function(person) {

    html += `

      <button
        class="person"
        onclick="selectPerson('${escapeJs(person.ma)}')">

        <div class="person-name">
          ${escapeHtml(person.hoTen)}
        </div>

        <div class="person-be">
          ${escapeHtml(person.be)}
        </div>

      </button>
    `;

  });

  html += `</div>`;

  result.innerHTML = html;

}


function selectPerson(ma) {

  const result =
    document.getElementById('result');

  result.innerHTML =
    '<div class="loading">Đang điểm danh...</div>';

  google.script.run

    .withSuccessHandler(function(data) {
      handleResult(data, 'SĐT');
    })

    .withFailureHandler(handleFailure)

    .checkIn(ma, 'SĐT');

}


function showWarning(title, detail) {

  const result =
    document.getElementById('result');

  result.innerHTML = `

    <div class="result-card duplicate-card">

      <div class="result-icon">⏳</div>

      <div class="result-title">
        ${escapeHtml(title)}
      </div>

      <div class="result-info">
        ${escapeHtml(detail || '')}
      </div>

    </div>
  `;

}


function showError(message) {

  const result =
    document.getElementById('result');

  result.innerHTML = `

    <div class="result-card error-card">

      <div class="result-icon">🔴</div>

      <div class="result-title">
        KHÔNG THỂ ĐIỂM DANH
      </div>

      <div class="result-info">
        ${escapeHtml(message)}
      </div>

    </div>
  `;

}


function showWaiting() {

  document.getElementById('result')
    .innerHTML = '';

}


function handleFailure(error) {

  resetButton();

  beep('error');

  showError(
    error.message ||
    'Lỗi kết nối hệ thống.'
  );

}


function resetButton() {

  const button =
    document.getElementById('checkinButton');

  if (!button) return;

  button.disabled = false;
  button.textContent = 'ĐIỂM DANH';

}


function clearInputLater() {

  const input =
    document.getElementById('input');

  input.value = '';

  input.focus();

}


/* ================================
   DASHBOARD
================================ */

function refreshDashboard() {

  google.script.run

    .withSuccessHandler(function(data) {

      if (!data.success) {

        document.getElementById('session')
          .textContent = data.message;

        return;
      }

      document.getElementById('session')
        .textContent =
          data.maBuoi +
          ' • ' +
          data.tenBuoi;

      document.getElementById('total')
        .textContent =
          data.tongSo;

      document.getElementById('present')
        .textContent =
          data.daCoMat;

      document.getElementById('absent')
        .textContent =
          data.chuaCoMat;

    })

    .withFailureHandler(function() {

      document.getElementById('session')
        .textContent =
          'Không tải được thông tin buổi.';

    })

    .getDashboardInfo();

}


/* ================================
   ĐIỀU HƯỚNG
================================ */

function goAdmin() {

  window.open(
    "<?= ScriptApp.getService().getUrl() ?>?page=admin",
    "_blank",
    "noopener"
  );

}


/* ================================
   ESCAPE
================================ */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function escapeJs(value) {

  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");

}


/* ================================
   KHỞI ĐỘNG
================================ */

window.onload = function() {

  refreshDashboard();

  document.getElementById('input')
    .focus();

};
