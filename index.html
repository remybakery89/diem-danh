<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- PWA - Điểm danh SCYC -->
<link rel="manifest" href="/diem-danh/manifest.json">

<meta name="theme-color" content="#f59e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

  <!-- QR scanner chạy trực tiếp trên GitHub Pages -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f5f8;
      font-family: Arial, sans-serif;
      color: #202124;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 16px 14px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .system-status {
      margin-top: 7px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }
    .status-loading { color: #9a6700; }
    .status-ready { color: #137333; }
    .status-retrying { color: #9a6700; }
    .status-error { color: #c5221f; }

    .session {
      margin-top: 6px;
      color: #6b7280;
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .stat {
      background: white;
      border-radius: 15px;
      padding: 13px 7px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
    }

    .stat-label {
      margin-top: 3px;
      font-size: 12px;
      color: #6b7280;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .section-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    /* QR */
    #reader {
  width: 100%;
  overflow: hidden;
  overflow-anchor: none;
  border-radius: 15px;
  background: #111;
  min-height: 280px;
}
    #reader video {
      width: 100% !important;
      border-radius: 15px;
    }

    .scanner-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 9px;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-primary {
      background: #4285f4;
      color: white;
    }

    .btn-secondary {
      background: #e8eaed;
      color: #333;
    }

    .btn:disabled {
      opacity: .55;
      cursor: default;
    }

    .hint {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin: 10px 0 0;
    }

    /* Manual check-in */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 15px;
      color: #888;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mode {
      border: 2px solid #e0e3e7;
      background: white;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .mode.active {
      border-color: #4285f4;
      background: #eaf2ff;
      color: #1967d2;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid #dadce0;
      border-radius: 13px;
      font-size: 24px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #4285f4;
    }

    button.checkin {
      width: 100%;
      margin-top: 11px;
      padding: 16px;
      border: 0;
      border-radius: 13px;
      background: #4285f4;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button.checkin:disabled {
      opacity: .6;
    }

    #result {
  margin: 0 0 16px;
  overflow-anchor: none;
}

    .result-card {
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    .success-card {
      background: #e8f5e9;
      color: #137333;
    }

    .duplicate-card {
      background: #fff8e1;
      color: #9a6700;
    }

    .error-card {
      background: #fce8e6;
      color: #c5221f;
    }

    .result-icon { font-size: 36px; }
    .result-title {
      font-size: 20px;
      font-weight: bold;
      margin-top: 6px;
    }
    .result-name {
      font-size: 27px;
      font-weight: bold;
      margin-top: 9px;
    }
    .result-info {
      margin-top: 5px;
      font-size: 15px;
    }

    .person {
      width: 100%;
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      margin-top: 8px;
      text-align: left;
      cursor: pointer;
    }

    .person-name {
      font-weight: bold;
      font-size: 17px;
    }

    .person-be {
      color: #666;
      margin-top: 3px;
    }

    .audio-note {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #777;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .nav a {
      text-decoration: none;
      color: #1967d2;
      font-size: 13px;
      font-weight: bold;
    }

    @media (max-width: 420px) {
      .header h1 { font-size: 24px; }
      .card { padding: 14px; }
      .result-name { font-size: 24px; }
    }
  </style>
</head>

<body>
<div class="app">

  <div class="header">

    <div class="session" id="session">Đang tải thông tin buổi...</div>
    <div id="systemStatus" class="system-status status-loading">
      🟡 Đang kết nối hệ thống...
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-number" id="total">-</div>
      <div class="stat-label">Tổng active</div>
    </div>
    <div class="stat">
      <div class="stat-number" id="present">-</div>

    </div>
    <div class="stat">
      <div class="stat-number" id="absent">-</div>

  <div class="card">
    <div id="result"></div>
    <div id="reader"></div>

    <div class="scanner-controls">
      <button class="btn btn-primary" id="startBtn" onclick="startScanner()">
        📷 Bắt đầu quét
      </button>
      <button class="btn btn-secondary" id="stopBtn" onclick="stopScanner()" disabled>
        ■ Dừng camera
      </button>

    <div class="hint">Đưa mã QR của ca viên vào khung. Quét xong hệ thống tự điểm danh.</div>

    <div class="audio-note">
      🔊 Nếu trình duyệt chặn âm thanh lần đầu, chạm màn hình một lần để bật tiếng bíp.
    </div>

    <div class="divider">hoặc nhập thủ công</div>

    <div class="modes">
      <button class="mode active" id="modePhone" onclick="setMode('phone')">
        🔢 4 số cuối
      </button>
      <button class="mode" id="modeCode" onclick="setMode('code')">
        👤 Mã cá nhân
      </button>
    </div>

    <label id="inputLabel">Nhập 4 số cuối SĐT</label>

    <input
      id="input"
      type="text"
      inputmode="numeric"
      maxlength="4"
      placeholder="0001"
      autocomplete="off"
      onkeydown="handleEnter(event)"
    >

    <button class="checkin" id="checkinButton" onclick="submitCheckIn()">
      ĐIỂM DANH
    </button>

    

  </div>

  <div class="nav">
    <a href="#" onclick="openAdmin(); return false;">⚙️ Quản trị</a>
  </div>

</div>

<script>
/*
 * ============================================================
 * CẤU HÌNH
 * ============================================================
 *
 * Thay URL dưới đây bằng URL Web App Apps Script đang chạy
 * của hệ thống điểm danh.
 *
 * Ví dụ:
 * https://script.google.com/macros/s/XXXXXXXX/exec
 */
const API_URL = 'https://script.google.com/macros/s/AKfycbwz3zvWXEqWw06jgT3xR3SjuulNnxN92vGmTsTSeLd0EADn_1AO-AG0LoSEr2CjqaN3nw/exec';

let scanner = null;
let scanning = false;
let processingQR = false;
let lockedQR = '';
let currentMode = 'phone';
let audioContext = null;

// Trạng thái riêng của dashboard.
// Dashboard chỉ tải lúc mở trang và tự retry nếu lần đầu thất bại.
let dashboardLoaded = false;
let dashboardLoading = false;
let dashboardRetryTimer = null;

// Dữ liệu dùng riêng cho việc quét QR.
// Tải một lần khi mở trang và giữ trong trình duyệt.
let checkinConfigLoaded = false;
let checkinConfigLoading = false;
let checkinMembers = {};
let checkinSession = null;
let checkinAttendance = {};

// QR đã được xác nhận local thì không chờ server để hiện kết quả.
// Request ghi Sheet chạy nền và tự retry nếu phản hồi chậm.
const pendingCheckins = {};


/* ============================================================
   ÂM THANH
   ============================================================ */

function unlockAudio() {
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
  } catch (e) {}
}

document.addEventListener('pointerdown', unlockAudio, { once: true });

function beep(type) {
  try {
    unlockAudio();

    if (!audioContext) return;

    const patterns = {
      success: [
        { freq: 880, delay: 0, duration: 0.13 },
        { freq: 1175, delay: 0.15, duration: 0.18 }
      ],

      duplicate: [
        { freq: 620, delay: 0, duration: 0.14 },
        { freq: 620, delay: 0.17, duration: 0.14 }
      ],

      error: [
        { freq: 440, delay: 0, duration: 0.18 },
        { freq: 300, delay: 0.20, duration: 0.24 }
      ],

      neutral: [
        { freq: 700, delay: 0, duration: 0.12 }
      ]
    };

    const pattern = patterns[type] || patterns.neutral;
    const now = audioContext.currentTime;

    pattern.forEach(function(item) {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.type = 'sine';
      oscillator.frequency.value = item.freq;

      const start = now + item.delay;
      const end = start + item.duration;

      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, end);

      oscillator.start(start);
      oscillator.stop(end + 0.01);
    });

  } catch (e) {}
}


/* ============================================================
   API
   ============================================================ */

function apiUrl(params) {
  const query = new URLSearchParams(params).toString();
  return API_URL + '?' + query;
}

async function callApi(params, options) {

  options = options || {};

  // Không tự retry các request điểm danh.
  // Retry một request ghi dữ liệu có thể khiến lần ghi đầu đã thành công
  // nhưng phản hồi bị mất, rồi request thứ hai lại thành DUPLICATE.
  // Dashboard nếu cần retry sẽ truyền retries: 2 riêng.
  const retries =
    Number.isFinite(options.retries)
      ? options.retries
      : 0;

  const timeoutMs =
    Number.isFinite(options.timeoutMs)
      ? options.timeoutMs
      : 8000;

  // Chỉ dashboard mới điều khiển dòng trạng thái kết nối.
  // QR/SĐT không làm dòng trạng thái nhảy qua lại.
  const updateStatus =
    options.updateStatus === true;

  if (!API_URL || API_URL === 'DAN_URL_APPS_SCRIPT_VAO_DAY') {
    throw new Error('Chưa cấu hình API_URL của Apps Script.');
  }

  let lastError = null;

  for (let attempt = 0; attempt <= retries; attempt++) {

    try {

      if (attempt > 0 && updateStatus) {
        setSystemStatus(
          'retrying',
          '🟡 Đang kết nối lại... (' +
          (attempt + 1) + '/' +
          (retries + 1) + ')'
        );

        await sleep(500 * attempt);
      }

      const result =
        await callApiOnce(params, timeoutMs);

      if (updateStatus) {
        setSystemStatus(
          'ready',
          '🟢 Hệ thống sẵn sàng'
        );
      }

      return result;

    } catch (error) {
      lastError = error;
    }
  }

  if (updateStatus) {
    setSystemStatus(
      'error',
      '🔴 Kết nối thông tin buổi không ổn định'
    );
  }

  throw lastError ||
    new Error('Không kết nối được máy chủ.');
}

function callApiOnce(params, timeoutMs) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      '__checkinCallback_' + Date.now() + '_' +
      Math.floor(Math.random() * 1000000);

    const script = document.createElement('script');

    const request = Object.assign({}, params, {
      callback: callbackName,
      _ts: Date.now() + '_' +
        Math.random().toString(36).slice(2)
    });

    const query = new URLSearchParams(request).toString();
    let finished = false;

    const timer = setTimeout(function() {
      if (finished) return;
      finished = true;
      cleanup();
      reject(new Error('Máy chủ phản hồi quá lâu.'));
    }, timeoutMs);

    function cleanup() {
      clearTimeout(timer);
      try { delete window[callbackName]; } catch (e) {}
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data) {
      if (finished) return;
      finished = true;
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      if (finished) return;
      finished = true;
      cleanup();
      reject(new Error('Không kết nối được máy chủ.'));
    };

    script.src = API_URL + '?' + query;
    document.body.appendChild(script);
  });
}

function sleep(ms) {
  return new Promise(function(resolve) {
    setTimeout(resolve, ms);
  });
}

function setSystemStatus(type, text) {
  const box = document.getElementById('systemStatus');
  if (!box) return;
  box.className = 'system-status status-' + type;
  box.textContent = text;
}


/* ============================================================
   CẤU HÌNH QUÉT QR - TẢI MỘT LẦN
   ============================================================ */

async function loadCheckinConfig(retryCount) {
  if (checkinConfigLoading || checkinConfigLoaded) return;

  checkinConfigLoading = true;
  retryCount = Number.isFinite(retryCount) ? retryCount : 0;

  setSystemStatus('loading', '🟡 Đang tải dữ liệu quét...');

  try {
    const data = await callApi(
      { api: 'checkin_config' },
      {
        retries: 0,
        timeoutMs: 8000,
        updateStatus: false
      }
    );

    if (!data || !data.success) {
      throw new Error(
        (data && data.message) ||
        'Không tải được dữ liệu quét.'
      );
    }

    checkinMembers = data.members || {};
    checkinAttendance = data.attendance || {};
    checkinSession = data.buoi || null;
    checkinConfigLoaded = true;

    if (checkinSession) {
      document.getElementById('session').textContent =
        checkinSession.maBuoi + ' • ' +
        checkinSession.tenBuoi;
    } else {
      document.getElementById('session').textContent =
        'Hôm nay không có buổi điểm danh.';
    }

    const stats = data.stats || {};
    document.getElementById('total').textContent =
      Number.isFinite(Number(stats.tongSo)) ? stats.tongSo : '-';
    document.getElementById('present').textContent =
      Number.isFinite(Number(stats.daCoMat)) ? stats.daCoMat : '-';
    document.getElementById('absent').textContent =
      Number.isFinite(Number(stats.chuaCoMat)) ? stats.chuaCoMat : '-';

    setSystemStatus('ready', '🟢 Sẵn sàng quét');

  } catch (error) {
    checkinConfigLoaded = false;

    if (retryCount < 3) {
      setSystemStatus(
        'retrying',
        '🟡 Đang kết nối lại dữ liệu quét...'
      );

      setTimeout(function() {
        checkinConfigLoading = false;
        loadCheckinConfig(retryCount + 1);
      }, 1500);

      return;
    }

    setSystemStatus(
      'error',
      '🔴 Chưa tải được dữ liệu quét. Hãy tải lại trang.'
    );

  } finally {
    if (retryCount >= 3 || checkinConfigLoaded) {
      checkinConfigLoading = false;
    }
  }
}

/* ============================================================
   QR SCANNER
   ============================================================ */

async function startScanner(retryCount) {

  unlockAudio();

  if (scanning) return;

  retryCount = Number.isFinite(retryCount) ? retryCount : 0;

  try {

    if (scanner) {
      try { await scanner.clear(); } catch (e) {}
    }

    scanner = new Html5Qrcode('reader');

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScanSuccess,
      function() {}
    );

    scanning = true;

    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;

    setSystemStatus('ready', '🟢 Camera sẵn sàng');

    showNeutral(
      '📷',
      'Đang quét QR',
      'Đưa mã QR vào khung.'
    );

  } catch (error) {

    scanning = false;

    if (retryCount < 2) {

      showNeutral(
        '⏳',
        'Đang khởi động camera...',
        'Thử lại tự động.'
      );

      setTimeout(function() {
        startScanner(retryCount + 1);
      }, 700);

      return;
    }

    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;

    showError(
      'Không mở được camera. Hãy kiểm tra quyền camera rồi bấm "Bắt đầu quét" lại.'
    );
  }
}

async function stopScanner() {
  if (!scanner || !scanning) return;

  try {
    await scanner.stop();
  } catch (e) {}

  scanning = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
}

async function onScanSuccess(decodedText) {
  const code = String(decodedText || '').trim().toUpperCase();

  // Cùng một mã còn nằm trong khung thì bỏ qua callback lặp.
  if (code && code === lockedQR) return;
  if (processingQR) return;

  lockedQR = code;

  if (!/^SC\d+$/i.test(code)) {
    beep('error');
    showError('Mã QR không hợp lệ: ' + code);
    return;
  }

  // Không quét khi bộ dữ liệu ban đầu chưa sẵn sàng.
  if (!checkinConfigLoaded) {
    beep('neutral');
    showNeutral(
      '⏳',
      'Đang tải dữ liệu',
      'Chờ hệ thống sẵn sàng rồi quét lại.'
    );
    return;
  }

  if (!checkinSession) {
    beep('error');
    showError('Hôm nay không có buổi điểm danh.');
    return;
  }

  const member = checkinMembers[code];

  // Đối chiếu mã + trạng thái đã điểm danh NGAY TRÊN MÁY.
  if (!member) {
    beep('error');
    showError('Không tìm thấy ca viên với mã: ' + code);
    return;
  }

  if (checkinAttendance[code]) {
    beep('duplicate');
    showDuplicate({
      hoTen: member.hoTen,
      be: member.be,
      thoiGianCu: checkinAttendance[code].thoiGian
    });
    return;
  }

  /*
   * ==========================================================
   * QUAN TRỌNG:
   * Xác nhận QR NGAY bằng dữ liệu local.
   *
   * Không await Apps Script nữa.
   * Người quét không phải chờ appendRow(), LockService,
   * mạng hoặc JSONP response.
   * ==========================================================
   */

  const localTime = formatLocalNow();

  // Khóa mã ngay trên máy để callback camera không quét lại.
  checkinAttendance[code] = {
    thoiGian: localTime,
    phuongThuc: 'QR',
    pending: true
  };

  beep('success');

  const qrScrollY = window.scrollY;

showSuccess({
  ma: code,
  hoTen: member.hoTen,
  be: member.be,
  thoiGian: localTime
});

updateLocalStatsAfterCheckIn();

requestAnimationFrame(() => {
  window.scrollTo(0, qrScrollY);

  requestAnimationFrame(() => {
    window.scrollTo(0, qrScrollY);
  });
});

  // Gửi ghi nhận lên server ở nền.
  // Không await và không hiển thị timeout cho người dùng.
  syncCheckinInBackground(code, member, localTime);
}


/*
 * ============================================================
 * GHI ĐIỂM DANH NỀN
 * ============================================================
 *
 * UI đã xác nhận local trước.
 * Server chỉ làm nhiệm vụ ghi vào Google Sheet.
 *
 * Nếu request timeout nhưng server đã ghi thành công:
 * - không hiện lỗi
 * - retry có thể nhận DUPLICATE
 * - DUPLICATE được coi là đã ghi thành công
 *
 * Nếu server thực sự từ chối (NOT_FOUND / NO_SESSION / SERVER_ERROR...):
 * - rollback local
 * - cập nhật lại thống kê
 * - báo lỗi rõ ràng
 */
function syncCheckinInBackground(code, member, localTime, attempt) {

  attempt = Number.isFinite(attempt) ? attempt : 0;

  if (pendingCheckins[code]) return;

  pendingCheckins[code] = true;

  callApi({
    api: 'checkin',
    code: code
  }, {
    retries: 0,
    timeoutMs: 7000,
    updateStatus: false
  })
  .then(function(result) {

    delete pendingCheckins[code];

    if (result && result.success === true) {

      // Server đã ghi thành công.
      checkinAttendance[code] = {
        thoiGian: result.thoiGian || localTime,
        phuongThuc: 'QR',
        pending: false
      };

      return;
    }

    if (result && result.type === 'DUPLICATE') {

      // Trường hợp timeout ở lần đầu nhưng server thực tế đã ghi.
      // DUPLICATE ở đây = dữ liệu đã tồn tại, coi như thành công.
      checkinAttendance[code] = {
        thoiGian: result.thoiGianCu || localTime,
        phuongThuc: 'QR',
        pending: false
      };

      return;
    }

    // Lỗi có kết quả rõ ràng từ server.
    rollbackLocalCheckin(
      code,
      'Máy chủ không ghi nhận được điểm danh: ' +
      ((result && result.message) || 'Lỗi không xác định.')
    );
  })
  .catch(function(error) {

    delete pendingCheckins[code];

    /*
     * Timeout / lỗi mạng KHÔNG đồng nghĩa ghi thất bại.
     * Có thể appendRow đã chạy xong nhưng JSONP response
     * về trình duyệt quá chậm.
     *
     * Retry tối đa 2 lần ở nền.
     */
    if (attempt < 2) {

      setTimeout(function() {
        syncCheckinInBackground(
          code,
          member,
          localTime,
          attempt + 1
        );
      }, 1200 * (attempt + 1));

      return;
    }

    /*
     * Sau 3 lần vẫn không nhận được phản hồi:
     * KHÔNG hiện "máy chủ phản hồi quá lâu" cho người dùng.
     *
     * Giữ trạng thái local để người quét không bị bắt
     * quét lại một người có khả năng đã được ghi.
     */
    checkinAttendance[code] = {
      thoiGian: localTime,
      phuongThuc: 'QR',
      pending: true
    };

    console.warn(
      'Check-in chưa xác nhận được từ server:',
      code,
      error && error.message
    );
  });
}


function rollbackLocalCheckin(code, message) {

  if (!checkinAttendance[code]) return;

  delete checkinAttendance[code];

  const presentEl = document.getElementById('present');
  const absentEl = document.getElementById('absent');

  const present = Number(presentEl.textContent);
  const absent = Number(absentEl.textContent);

  if (Number.isFinite(present) && present > 0) {
    presentEl.textContent = present - 1;
  }

  if (Number.isFinite(absent)) {
    absentEl.textContent = absent + 1;
  }

  beep('error');
  showError(message);
}


function formatLocalNow() {

  const now = new Date();

  const pad = function(value) {
    return String(value).padStart(2, '0');
  };

  return (
    pad(now.getDate()) + '/' +
    pad(now.getMonth() + 1) + '/' +
    now.getFullYear() + ' ' +
    pad(now.getHours()) + ':' +
    pad(now.getMinutes()) + ':' +
    pad(now.getSeconds())
  );
}


/* ============================================================
   CHẾ ĐỘ NHẬP
   ============================================================ */

function setMode(mode) {
  currentMode = mode;

  const input = document.getElementById('input');

  document.getElementById('modePhone').classList.toggle('active', mode === 'phone');
  document.getElementById('modeCode').classList.toggle('active', mode === 'code');

  if (mode === 'phone') {
    document.getElementById('inputLabel').textContent = 'Nhập 4 số cuối SĐT';
    input.placeholder = '0001';
    input.maxLength = 4;
    input.inputMode = 'numeric';
  } else {
    document.getElementById('inputLabel').textContent = 'Nhập mã cá nhân';
    input.placeholder = 'SC001';
    input.maxLength = 20;
    input.inputMode = 'text';
  }

  input.value = '';
  input.focus();
}

function handleEnter(event) {
  if (event.key === 'Enter') {
    submitCheckIn();
  }
}


/* ============================================================
   NHẬP THỦ CÔNG
   ============================================================ */

async function submitCheckIn() {
  const input = document.getElementById('input');
  const button = document.getElementById('checkinButton');

  let value = input.value.trim();

  if (!value) {
    showError('Vui lòng nhập thông tin ca viên.');
    input.focus();
    return;
  }

  if (currentMode === 'phone' && !/^\d{4}$/.test(value)) {
    showError('Vui lòng nhập đúng 4 số.');
    input.focus();
    return;
  }

  if (currentMode === 'code') {
    value = value.toUpperCase();

    if (checkinConfigLoaded) {
      const member = checkinMembers[value];

      if (!member) {
        beep('error');
        showError('Không tìm thấy ca viên với mã: ' + value);
        return;
      }

      if (checkinAttendance[value]) {
        beep('duplicate');
        showDuplicate({
          hoTen: member.hoTen,
          be: member.be,
          thoiGianCu: checkinAttendance[value].thoiGian
        });
        return;
      }
    }
  }

  button.disabled = true;
  button.textContent = 'ĐANG KIỂM TRA...';

  try {
    let result;

    if (currentMode === 'phone') {
      result = await callApi({
        api: 'checkin_phone',
        value: value
      });
    } else {
      result = await callApi({
        api: 'checkin',
        code: value
      });
    }

    handleResult(result);

  } catch (error) {
    showError(error.message || 'Lỗi kết nối hệ thống.');
  }

  resetButton();
}


/* ============================================================
   KẾT QUẢ
   ============================================================ */

function handleResult(data) {
  if (!data) {
    beep('error');
    showError('Không nhận được kết quả.');
    return;
  }

  if (data.success === true) {
    beep('success');
    showSuccess(data);

    // Cập nhật bộ dữ liệu local ngay sau khi server ghi thành công.
    checkinAttendance[data.ma] = {
      thoiGian: data.thoiGian || '',
      phuongThuc: 'QR'
    };

    updateLocalStatsAfterCheckIn();
    clearInputLater();
    return;
  }

  if (data.type === 'DUPLICATE') {
    beep('duplicate');
    showDuplicate(data);

    if (data.ma) {
      checkinAttendance[data.ma] = {
        thoiGian: data.thoiGianCu || '',
        phuongThuc: data.phuongThuc || ''
      };
    }

    clearInputLater();
    return;
  }

  if (data.type === 'MULTIPLE_MATCHES') {
    beep('neutral');
    showMultiple(data.matches || []);
    return;
  }

  beep('error');
  showError(data.message || 'Không thể điểm danh.');
}

function showSuccess(data) {
  document.getElementById('result').innerHTML = `
    <div class="result-card success-card">
      <div class="result-icon">🟢</div>
      <div class="result-title">ĐIỂM DANH THÀNH CÔNG</div>
      <div class="result-name">${escapeHtml(data.hoTen || '')}</div>
      <div class="result-info">${escapeHtml(data.be || '')}</div>
      <div class="result-info">${escapeHtml(data.thoiGian || '')}</div>
    </div>
  `;
}

function showDuplicate(data) {
  document.getElementById('result').innerHTML = `
    <div class="result-card duplicate-card">
      <div class="result-icon">🟡</div>
      <div class="result-title">ĐÃ ĐIỂM DANH</div>
      <div class="result-name">${escapeHtml(data.hoTen || '')}</div>
      <div class="result-info">${escapeHtml(data.be || '')}</div>
      <div class="result-info">
        Đã điểm danh lúc:
        <strong>${escapeHtml(data.thoiGianCu || '')}</strong>
      </div>
    </div>
  `;
}

function showMultiple(matches) {
  let html = `
    <div class="result-card duplicate-card">
      <div class="result-icon">🟠</div>
      <div class="multiple-title">CÓ NHIỀU CA VIÊN CÙNG 4 SỐ CUỐI</div>
      <div class="result-info">Hãy chọn đúng người:</div>
  `;

  matches.forEach(function(person) {
    html += `
      <button class="person"
        onclick="selectPerson('${escapeJs(person.ma)}')">
        <div class="person-name">${escapeHtml(person.hoTen)}</div>
        <div class="person-be">${escapeHtml(person.be)}</div>
      </button>
    `;
  });

  html += '</div>';
  document.getElementById('result').innerHTML = html;
}

function selectPerson(ma) {
  ma = String(ma || '').trim().toUpperCase();

  if (!checkinConfigLoaded || !checkinSession) {
    showError('Dữ liệu quét chưa sẵn sàng.');
    return;
  }

  const member = checkinMembers[ma];

  if (!member) {
    showError('Không tìm thấy ca viên với mã: ' + ma);
    return;
  }

  if (checkinAttendance[ma]) {
    beep('duplicate');
    showDuplicate({
      hoTen: member.hoTen,
      be: member.be,
      thoiGianCu: checkinAttendance[ma].thoiGian
    });
    return;
  }

  const localTime = formatLocalNow();

  checkinAttendance[ma] = {
    thoiGian: localTime,
    phuongThuc: 'QR',
    pending: true
  };

  beep('success');

  showSuccess({
    ma: ma,
    hoTen: member.hoTen,
    be: member.be,
    thoiGian: localTime
  });

  updateLocalStatsAfterCheckIn();
  clearInputLater();

  syncCheckinInBackground(ma, member, localTime);
}

function showError(message) {
  document.getElementById('result').innerHTML = `
    <div class="result-card error-card">
      <div class="result-icon">🔴</div>
      <div class="result-title">KHÔNG THỂ ĐIỂM DANH</div>
      <div class="result-info">${escapeHtml(message)}</div>
    </div>
  `;
}

function showNeutral(icon, title, message) {
  document.getElementById('result').innerHTML = `
    <div class="result-card" style="background:#f1f3f4;color:#444">
      <div class="result-icon">${escapeHtml(icon)}</div>
      <div class="result-title">${escapeHtml(title)}</div>
      <div class="result-info">${escapeHtml(message)}</div>
    </div>
  `;
}


/* ============================================================
   DASHBOARD
   ============================================================ */

function scheduleDashboardRetry() {

  if (dashboardRetryTimer) {
    clearTimeout(dashboardRetryTimer);
  }

  dashboardRetryTimer = setTimeout(function() {
    dashboardRetryTimer = null;
    refreshDashboard();
  }, 5000);
}


async function refreshDashboard() {

  // Không cho nhiều request dashboard chạy chồng lên nhau.
  if (dashboardLoading) return;

  dashboardLoading = true;

  // Chỉ hiện "Đang tải..." khi CHƯA từng lấy được thông tin buổi.
  if (!dashboardLoaded) {
    setSystemStatus(
      'loading',
      '🟡 Đang tải thông tin buổi...'
    );
  } else {
    setSystemStatus(
      'retrying',
      '🟡 Đang kết nối lại thông tin buổi...'
    );
  }

  try {

    const data = await callApi(
      { api: 'dashboard' },
      {
        retries: 2,
        timeoutMs: 6000,
        updateStatus: true
      }
    );

    if (!data || !data.success) {

      if (!dashboardLoaded) {
        document.getElementById('session').textContent =
          (data && data.message) ||
          'Chưa lấy được thông tin buổi.';
      }

      dashboardLoading = false;
      scheduleDashboardRetry();
      return;
    }

    document.getElementById('session').textContent =
      data.maBuoi + ' • ' + data.tenBuoi;

    document.getElementById('total').textContent =
      data.tongSo;

    document.getElementById('present').textContent =
      data.daCoMat;

    document.getElementById('absent').textContent =
      data.chuaCoMat;

    dashboardLoaded = true;
    dashboardLoading = false;

    if (dashboardRetryTimer) {
      clearTimeout(dashboardRetryTimer);
      dashboardRetryTimer = null;
    }

    setSystemStatus(
      'ready',
      '🟢 Hệ thống sẵn sàng'
    );

  } catch (error) {

    dashboardLoading = false;

    // Nếu đã lấy được buổi rồi thì KHÔNG xóa thông tin buổi.
    // Chỉ retry âm thầm ở nền.
    if (!dashboardLoaded) {
      document.getElementById('session').textContent =
        'Đang chờ kết nối...';

      setSystemStatus(
        'retrying',
        '🟡 Đang tự kết nối lại...'
      );
    }

    scheduleDashboardRetry();
  }
}


function updateLocalStatsAfterCheckIn() {

  const presentEl =
    document.getElementById('present');

  const absentEl =
    document.getElementById('absent');

  const present =
    Number(presentEl.textContent);

  const absent =
    Number(absentEl.textContent);

  if (Number.isFinite(present)) {
    presentEl.textContent = present + 1;
  }

  if (
    Number.isFinite(absent) &&
    absent > 0
  ) {
    absentEl.textContent = absent - 1;
  }
}


/* ============================================================
   ĐIỀU HƯỚNG
   ============================================================ */

function openAdmin() {
  if (!API_URL || API_URL === 'DAN_URL_APPS_SCRIPT_VAO_DAY') {
    alert('Chưa cấu hình URL Apps Script.');
    return;
  }

  // Mở Quản trị ở tab mới, giữ nguyên trang điểm danh.
  window.open(
    API_URL + '?page=admin',
    '_blank',
    'noopener'
  );
}


/* ============================================================
   TIỆN ÍCH
   ============================================================ */

function resetButton() {
  const button = document.getElementById('checkinButton');
  button.disabled = false;
  button.textContent = 'ĐIỂM DANH';
}

function clearInputLater() {
  const input = document.getElementById('input');
  input.value = '';
  input.focus();
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeJs(value) {
  return String(value == null ? '' : value)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");
}


/* ============================================================
   KHỞI ĐỘNG
   ============================================================ */

  loadCheckinConfig();

  startScanner();
});
